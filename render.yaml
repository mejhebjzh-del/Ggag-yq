services:
  - type: web
    name: snapscore-farm
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CONFIG_PATH
        value: /etc/secrets/config.yaml
      - key: SC_BACKEND
        value: pysnap
      - key: PYTHONUNBUFFERED
        value: "1"
